! NetArchitect educational draft. Review platform syntax and topology before deployment.
! Profile: Profile 3: Global WAN
! Assumption: this is a Layer 3 campus/distribution switch with SVI routing enabled.
hostname GLOBAL_CORE
no ip domain-lookup
vtp mode transparent
spanning-tree mode rapid-pvst
ip routing
! VLAN definitions and gateway SVIs
vlan 110
 name CITY1_IOT
!
interface Vlan110
 description City 1 IoT and scanner devices
 ip address 10.30.0.1 255.255.252.0
 no shutdown
!
vlan 120
 name CITY2_IOT
!
interface Vlan120
 description City 2 IoT and scanner devices
 ip address 10.30.4.1 255.255.254.0
 no shutdown
!
vlan 130
 name CITY3_SCANNERS
!
interface Vlan130
 description City 3 scanners
 ip address 10.30.6.1 255.255.254.0
 no shutdown
!
vlan 140
 name CITY4_SCANNERS
!
interface Vlan140
 description City 4 scanners
 ip address 10.30.8.1 255.255.254.0
 no shutdown
!
vlan 111
 name CITY1_USERS
!
interface Vlan111
 description City 1 staff
 ip address 10.30.10.1 255.255.255.0
 no shutdown
!
vlan 121
 name CITY2_USERS
!
interface Vlan121
 description City 2 staff
 ip address 10.30.11.1 255.255.255.0
 no shutdown
!
vlan 141
 name CITY4_USERS
!
interface Vlan141
 description City 4 staff
 ip address 10.30.12.1 255.255.255.0
 no shutdown
!
vlan 250
 name CLOUD_APPS
!
interface Vlan250
 description Cloud application segment
 ip address 10.30.13.1 255.255.255.0
 no shutdown
!
vlan 131
 name CITY3_USERS
!
interface Vlan131
 description City 3 staff
 ip address 10.30.14.1 255.255.255.128
 no shutdown
!
vlan 299
 name MANAGEMENT
!
interface Vlan299
 description Global network management
 ip address 10.30.14.129 255.255.255.128
 no shutdown
!
vlan 290
 name GUEST
!
interface Vlan290
 description Guest access
 ip address 10.30.15.1 255.255.255.128
 no shutdown
!
ip access-list extended IOT-TO-MANAGEMENT
 remark Isolate city1_iot from management
 deny ip 10.30.0.0 0.0.3.255 10.30.14.128 0.0.0.127
 permit ip 10.30.0.0 0.0.3.255 any
!
interface Vlan110
 ip access-group IOT-TO-MANAGEMENT in
!
ip access-list extended GUEST-TO-MANAGEMENT
 remark Isolate guest from management
 deny ip 10.30.15.0 0.0.0.127 10.30.14.128 0.0.0.127
 permit ip 10.30.15.0 0.0.0.127 any
!
interface Vlan290
 ip access-group GUEST-TO-MANAGEMENT in
!
! Routed connection to the edge router; peer is the allocated gateway address.
interface GigabitEthernet1/0/47
 description Routed transit to edge router - adapt physical port
 no switchport
 ip address 10.30.15.130 255.255.255.252
 no shutdown
!
! Example 802.1Q uplink to the access layer; adjust port and allowed VLANs.
interface GigabitEthernet1/0/48
 description 802.1Q trunk to access layer - adapt physical port
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130,140,111,121,141,250,131,299,290
 no shutdown
!
! OSPF control plane for directly attached SVIs and routed transit.
router ospf 10
 router-id 10.30.255.2
 passive-interface default
 no passive-interface GigabitEthernet1/0/47
 network 10.30.0.0 0.0.3.255 area 10
 network 10.30.4.0 0.0.1.255 area 20
 network 10.30.6.0 0.0.1.255 area 30
 network 10.30.8.0 0.0.1.255 area 40
 network 10.30.10.0 0.0.0.255 area 10
 network 10.30.11.0 0.0.0.255 area 20
 network 10.30.12.0 0.0.0.255 area 40
 network 10.30.13.0 0.0.0.255 area 0
 network 10.30.14.0 0.0.0.127 area 30
 network 10.30.14.128 0.0.0.127 area 0
 network 10.30.15.0 0.0.0.127 area 0
 network 10.30.15.128 0.0.0.3 area 0
!
end
