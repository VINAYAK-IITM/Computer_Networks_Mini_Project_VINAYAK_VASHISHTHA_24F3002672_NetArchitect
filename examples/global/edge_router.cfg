! NetArchitect educational draft. Replace placeholders and review platform syntax.
! Profile: Profile 3: Global WAN
! Assumption: one logical edge router terminates the listed routed handoffs.
hostname GLOBAL_EDGE
no ip domain-lookup
! Routed WAN interfaces; the peer uses the last usable IPv4 address in each /30.
interface GigabitEthernet0/0
 description Core-to-edge transit (gateway plus peer) - confirm handoff and peer address
 ip address 10.30.15.129 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description City 2 WAN handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.30.15.133 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description City 3 WAN handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.30.15.137 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description City 4 WAN handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.30.15.141 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description Cloud eBGP/IPsec routed handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.30.15.145 255.255.255.252
 no shutdown
!
! OSPF statements below are templates. Keep each network statement only on the router that owns it.
router ospf 10
 router-id 10.30.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 no passive-interface GigabitEthernet0/3
 no passive-interface GigabitEthernet0/4
 network 10.30.0.0 0.0.3.255 area 10
 network 10.30.4.0 0.0.1.255 area 20
 network 10.30.6.0 0.0.1.255 area 30
 network 10.30.8.0 0.0.1.255 area 40
 network 10.30.10.0 0.0.0.255 area 10
 network 10.30.11.0 0.0.0.255 area 20
 network 10.30.12.0 0.0.0.255 area 40
 network 10.30.13.0 0.0.0.255 area 0
 network 10.30.14.0 0.0.0.127 area 30
 network 10.30.14.128 0.0.0.127 area 0
 network 10.30.15.0 0.0.0.127 area 0
 network 10.30.15.128 0.0.0.3 area 0
 network 10.30.15.132 0.0.0.3 area 0
 network 10.30.15.136 0.0.0.3 area 0
 network 10.30.15.140 0.0.0.3 area 0
 network 10.30.15.144 0.0.0.3 area 0
!
! BGP summary is safe only if the aggregate is reserved and more-specific routes exist.
ip route 10.30.0.0 255.255.0.0 Null0 250
! Limit BGP-to-OSPF redistribution to the declared remote VPN prefix.
ip prefix-list CLOUD-REMOTE seq 5 permit 10.31.0.0/16
route-map BGP-TO-OSPF permit 10
 match ip address prefix-list CLOUD-REMOTE
!
router ospf 10
 redistribute bgp 65010 subnets route-map BGP-TO-OSPF
!
router bgp 65010
 neighbor 10.30.15.146 remote-as 65020
 neighbor 10.30.15.146 description Cloud/provider boundary - confirm peer details
 address-family ipv4 unicast
  neighbor 10.30.15.146 activate
  network 10.30.0.0 mask 255.255.0.0
 exit-address-family
!
! IPsec template: peer uses RFC 5737 documentation address; replace with the real endpoint.
! Confirm NAT traversal, current crypto policy, peer identity, and platform support.
ip access-list extended VPN-INTERESTING-TRAFFIC
 permit ip 10.30.0.0 0.0.255.255 10.31.0.0 0.0.255.255
!
crypto ikev2 proposal NETARCHITECT-IKEV2
 encryption aes-cbc-256
 integrity sha256
 group 14
crypto ikev2 policy 10
 proposal NETARCHITECT-IKEV2
crypto ikev2 keyring NETARCHITECT-KEYRING
 peer CLOUD-PEER
  address 198.51.100.10
  pre-shared-key local <REPLACE_WITH_SECRET>
  pre-shared-key remote <REPLACE_WITH_SECRET>
crypto ikev2 profile NETARCHITECT-IKEV2-PROFILE
 match identity remote address 198.51.100.10 255.255.255.255
 authentication remote pre-share
 authentication local pre-share
 keyring local NETARCHITECT-KEYRING
crypto ipsec transform-set NETARCHITECT-TS esp-aes 256 esp-sha256-hmac
 mode tunnel
crypto map NETARCHITECT-VPN 10 ipsec-isakmp
 set peer 198.51.100.10
 set transform-set NETARCHITECT-TS
 set ikev2-profile NETARCHITECT-IKEV2-PROFILE
 match address VPN-INTERESTING-TRAFFIC
interface GigabitEthernet0/4
 crypto map NETARCHITECT-VPN
!
end
