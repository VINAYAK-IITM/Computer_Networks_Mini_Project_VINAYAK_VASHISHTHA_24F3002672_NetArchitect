! NetArchitect educational draft. Replace placeholders and review platform syntax.
! Profile: Custom Lab Network
! Assumption: one logical edge router terminates the listed routed handoffs.
hostname CUSTOM-LAB_EDGE
no ip domain-lookup
! Routed WAN interfaces; the peer uses the last usable IPv4 address in each /30.
interface GigabitEthernet0/0
 description Routed core-to-edge transit - confirm handoff and peer address
 ip address 10.42.0.73 255.255.255.252
 no shutdown
!
! OSPF statements below are templates. Keep each network statement only on the router that owns it.
router ospf 10
 router-id 10.42.0.254
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.42.0.0 0.0.0.63 area 0
 network 10.42.0.64 0.0.0.7 area 0
 network 10.42.0.72 0.0.0.3 area 0
!
end
