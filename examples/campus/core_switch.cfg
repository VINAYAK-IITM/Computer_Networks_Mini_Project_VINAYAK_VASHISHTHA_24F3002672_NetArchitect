! NetArchitect educational draft. Review platform syntax and topology before deployment.
! Profile: Profile 1: Campus LAN
! Assumption: this is a Layer 3 campus/distribution switch with SVI routing enabled.
hostname CAMPUS_CORE
no ip domain-lookup
vtp mode transparent
spanning-tree mode rapid-pvst
ip routing
! VLAN definitions and gateway SVIs
vlan 10
 name STAFF
!
interface Vlan10
 description Staff workstations
 ip address 10.10.0.1 255.255.254.0
 no shutdown
!
vlan 20
 name STUDENTS
!
interface Vlan20
 description Student devices
 ip address 10.10.2.1 255.255.254.0
 no shutdown
!
vlan 30
 name VOICE
!
interface Vlan30
 description IP telephony
 ip address 10.10.4.1 255.255.255.0
 no shutdown
!
vlan 50
 name IOT
!
interface Vlan50
 description Campus IoT devices
 ip address 10.10.5.1 255.255.255.0
 no shutdown
!
vlan 90
 name GUEST
!
interface Vlan90
 description Guest wireless clients
 ip address 10.10.6.1 255.255.255.0
 no shutdown
!
vlan 40
 name ACCESS_POINTS
!
interface Vlan40
 description Managed PoE wireless access points
 ip address 10.10.7.1 255.255.255.192
 no shutdown
!
vlan 99
 name MANAGEMENT
!
interface Vlan99
 description Network device management
 ip address 10.10.7.65 255.255.255.192
 no shutdown
!
ip access-list extended GUEST-TO-MANAGEMENT
 remark Isolate guest from management
 deny ip 10.10.6.0 0.0.0.255 10.10.7.64 0.0.0.63
 permit ip 10.10.6.0 0.0.0.255 any
!
interface Vlan90
 ip access-group GUEST-TO-MANAGEMENT in
!
! Routed connection to the edge router; peer is the allocated gateway address.
interface GigabitEthernet1/0/47
 description Routed transit to edge router - adapt physical port
 no switchport
 ip address 10.10.7.130 255.255.255.252
 no shutdown
!
! Example 802.1Q uplink to the access layer; adjust port and allowed VLANs.
interface GigabitEthernet1/0/48
 description 802.1Q trunk to access layer - adapt physical port
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,50,90,40,99
 no shutdown
!
! OSPF control plane for directly attached SVIs and routed transit.
router ospf 10
 router-id 10.10.255.2
 passive-interface default
 no passive-interface GigabitEthernet1/0/47
 network 10.10.0.0 0.0.1.255 area 0
 network 10.10.2.0 0.0.1.255 area 0
 network 10.10.4.0 0.0.0.255 area 0
 network 10.10.5.0 0.0.0.255 area 0
 network 10.10.6.0 0.0.0.255 area 0
 network 10.10.7.0 0.0.0.63 area 0
 network 10.10.7.64 0.0.0.63 area 0
 network 10.10.7.128 0.0.0.3 area 0
!
end
