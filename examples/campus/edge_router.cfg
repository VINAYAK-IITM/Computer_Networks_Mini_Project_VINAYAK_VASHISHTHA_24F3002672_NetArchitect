! NetArchitect educational draft. Replace placeholders and review platform syntax.
! Profile: Profile 1: Campus LAN
! Assumption: one logical edge router terminates the listed routed handoffs.
hostname CAMPUS_EDGE
no ip domain-lookup
! Routed WAN interfaces; the peer uses the last usable IPv4 address in each /30.
interface GigabitEthernet0/0
 description Routed core-to-edge transit (gateway plus peer) - confirm handoff and peer address
 ip address 10.10.7.129 255.255.255.252
 no shutdown
!
! OSPF statements below are templates. Keep each network statement only on the router that owns it.
router ospf 10
 router-id 10.10.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.10.0.0 0.0.1.255 area 0
 network 10.10.2.0 0.0.1.255 area 0
 network 10.10.4.0 0.0.0.255 area 0
 network 10.10.5.0 0.0.0.255 area 0
 network 10.10.6.0 0.0.0.255 area 0
 network 10.10.7.0 0.0.0.63 area 0
 network 10.10.7.64 0.0.0.63 area 0
 network 10.10.7.128 0.0.0.3 area 0
!
end
