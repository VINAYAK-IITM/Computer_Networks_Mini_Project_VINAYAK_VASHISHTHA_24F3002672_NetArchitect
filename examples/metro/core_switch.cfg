! NetArchitect educational draft. Review platform syntax and topology before deployment.
! Profile: Profile 2: Metro MAN
! Assumption: this is a Layer 3 campus/distribution switch with SVI routing enabled.
hostname METRO_CORE
no ip domain-lookup
vtp mode transparent
spanning-tree mode rapid-pvst
ip routing
! VLAN definitions and gateway SVIs
vlan 10
 name HQ_USERS
!
interface Vlan10
 description Headquarters users
 ip address 10.20.0.1 255.255.255.0
 no shutdown
!
vlan 110
 name EAST_USERS
!
interface Vlan110
 description East office users
 ip address 10.20.1.1 255.255.255.128
 no shutdown
!
vlan 210
 name WEST_USERS
!
interface Vlan210
 description West office users
 ip address 10.20.1.129 255.255.255.128
 no shutdown
!
vlan 30
 name HQ_VOICE
!
interface Vlan30
 description Headquarters voice
 ip address 10.20.2.1 255.255.255.192
 no shutdown
!
vlan 99
 name HQ_MANAGEMENT
!
interface Vlan99
 description Headquarters management
 ip address 10.20.2.65 255.255.255.192
 no shutdown
!
vlan 310
 name COLO_SERVICES
!
interface Vlan310
 description FinTech colocation services
 ip address 10.20.2.129 255.255.255.192
 no shutdown
!
vlan 130
 name EAST_VOICE
!
interface Vlan130
 description East office voice
 ip address 10.20.2.193 255.255.255.224
 no shutdown
!
vlan 199
 name EAST_MANAGEMENT
!
interface Vlan199
 description East office management
 ip address 10.20.2.225 255.255.255.224
 no shutdown
!
vlan 230
 name WEST_VOICE
!
interface Vlan230
 description West office voice
 ip address 10.20.3.1 255.255.255.224
 no shutdown
!
vlan 299
 name WEST_MANAGEMENT
!
interface Vlan299
 description West office management
 ip address 10.20.3.33 255.255.255.224
 no shutdown
!
! Routed connection to the edge router; peer is the allocated gateway address.
interface GigabitEthernet1/0/47
 description Routed transit to edge router - adapt physical port
 no switchport
 ip address 10.20.3.66 255.255.255.252
 no shutdown
!
! Example 802.1Q uplink to the access layer; adjust port and allowed VLANs.
interface GigabitEthernet1/0/48
 description 802.1Q trunk to access layer - adapt physical port
 switchport mode trunk
 switchport trunk allowed vlan 10,110,210,30,99,310,130,199,230,299
 no shutdown
!
! OSPF control plane for directly attached SVIs and routed transit.
router ospf 10
 router-id 10.20.255.2
 passive-interface default
 no passive-interface GigabitEthernet1/0/47
 network 10.20.0.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.127 area 10
 network 10.20.1.128 0.0.0.127 area 20
 network 10.20.2.0 0.0.0.63 area 0
 network 10.20.2.64 0.0.0.63 area 0
 network 10.20.2.128 0.0.0.63 area 30
 network 10.20.2.192 0.0.0.31 area 10
 network 10.20.2.224 0.0.0.31 area 10
 network 10.20.3.0 0.0.0.31 area 20
 network 10.20.3.32 0.0.0.31 area 20
 network 10.20.3.64 0.0.0.3 area 0
!
end
