! NetArchitect educational draft. Replace placeholders and review platform syntax.
! Profile: Profile 2: Metro MAN
! Assumption: one logical edge router terminates the listed routed handoffs.
hostname METRO_EDGE
no ip domain-lookup
! Routed WAN interfaces; the peer uses the last usable IPv4 address in each /30.
interface GigabitEthernet0/0
 description HQ core-to-edge transit (gateway plus peer) - confirm handoff and peer address
 ip address 10.20.3.65 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description East EVPL routed handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.20.3.69 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description West primary routed handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.20.3.73 255.255.255.252
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/3
 description West diverse backup handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.20.3.77 255.255.255.252
 ip ospf cost 100
 no shutdown
!
interface GigabitEthernet0/4
 description Colocation routed handoff (gateway plus peer) - confirm handoff and peer address
 ip address 10.20.3.81 255.255.255.252
 no shutdown
!
! OSPF statements below are templates. Keep each network statement only on the router that owns it.
router ospf 10
 router-id 10.20.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 no passive-interface GigabitEthernet0/3
 no passive-interface GigabitEthernet0/4
 network 10.20.0.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.127 area 10
 network 10.20.1.128 0.0.0.127 area 20
 network 10.20.2.0 0.0.0.63 area 0
 network 10.20.2.64 0.0.0.63 area 0
 network 10.20.2.128 0.0.0.63 area 30
 network 10.20.2.192 0.0.0.31 area 10
 network 10.20.2.224 0.0.0.31 area 10
 network 10.20.3.0 0.0.0.31 area 20
 network 10.20.3.32 0.0.0.31 area 20
 network 10.20.3.64 0.0.0.3 area 0
 network 10.20.3.68 0.0.0.3 area 0
 network 10.20.3.72 0.0.0.3 area 0
 network 10.20.3.76 0.0.0.3 area 0
 network 10.20.3.80 0.0.0.3 area 0
!
! QoS example: trust/remark traffic at the access boundary and align classes with the carrier.
! Priority queuing improves local treatment; it cannot guarantee the end-to-end latency target.
class-map match-any REALTIME-VOICE
 match dscp ef
class-map match-any BUSINESS-CRITICAL
 match dscp af31
policy-map WAN-QOS
 class REALTIME-VOICE
  priority percent 20
 class BUSINESS-CRITICAL
  bandwidth percent 30
 class class-default
  fair-queue
interface GigabitEthernet0/1
 service-policy output WAN-QOS
!
interface GigabitEthernet0/2
 service-policy output WAN-QOS
!
interface GigabitEthernet0/3
 service-policy output WAN-QOS
!
interface GigabitEthernet0/4
 service-policy output WAN-QOS
!
end
