[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netarchitect-cic307"
version = "1.0.0"
description = "Explainable network planning and Cisco IOS draft generation for CIC-307"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
netarchitect = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

